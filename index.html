<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 마스터</title>
<style>
:root{--blue:#2563eb;--bg:#f5f7fb;--line:#e5e7eb;--text:#172033;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#e9efff;color:#1d4ed8}
button.gray{background:#eef1f5;color:#344054}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:1050px;margin:auto;padding:28px 16px 60px}
.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px #1720330d}
.hero{padding:30px;position:sticky;top:0;z-index:20;text-align:center}.panel{padding:22px;margin-top:18px}
h1{font-size:46px;letter-spacing:-2px;margin:0 0 8px}h2{margin:0 0 16px}
p{line-height:1.75}.muted{color:var(--muted)}
.row{display:flex;gap:9px;flex-wrap:wrap}.hero .row{justify-content:center}.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.page-title-row h2{margin:0}.page-title-row button{flex-shrink:0}.hidden{display:none!important}
.filebox{border:2px dashed #cbd5e1;border-radius:16px;padding:20px;text-align:center}
.saved-file-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.saved-file-item{width:100%;text-align:left;background:#eef3ff;color:#1450d2;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:800;cursor:pointer}
.saved-file-item:hover{background:#dce7ff}
.saved-file-item:disabled{opacity:.6;cursor:wait}
.filebox input{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:#f8fafc;border-radius:14px;padding:14px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:22px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.keybtn{width:100%;padding:14px 8px}
.list{display:grid;gap:9px;margin-top:15px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}
.item:hover{background:#f8fafc}
.item b{display:block;margin-bottom:6px}
.quiz{background:#f8fafc;border-radius:17px;padding:20px}
.question{font-size:19px;font-weight:750;margin-bottom:12px}
.answer{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}
.feedback{margin-top:14px;padding:13px;border-radius:12px;background:#fff;border:1px solid var(--line)}.passage-answer-btn{display:inline-block!important;background:#2563eb!important;color:#fff!important;font-size:16px!important;font-weight:800!important;padding:13px 20px!important;border-radius:12px!important;visibility:visible!important;opacity:1!important}
.ok{color:#078a62;font-weight:800}.bad{color:#d92d20;font-weight:800}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#eef2f7;color:#475467;font-size:13px}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range label{font-size:13px;color:var(--muted)}.range input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px}
.notice{background:#eff6ff;color:#1e40af;padding:12px 14px;border-radius:12px;margin-bottom:14px}

/* 모바일 상단 정보 접기/펼치기 */
.hero{position:sticky;top:0;z-index:20}
.stats-toggle{
  position:absolute;
  right:18px;
  bottom:10px;
  width:34px;
  height:34px;
  min-width:34px;
  padding:0;
  border:1px solid #efc5d7;
  border-radius:50%;
  background:rgba(255,247,251,.96);
  color:#c94f7f;
  box-shadow:0 3px 9px rgba(164,87,119,.12);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:20px;
  line-height:1;
}
.stats-toggle:hover{background:#fff0f6}
.stats-toggle span{display:block;transform:translateY(-1px)}
.hero.app-started .stats-toggle{display:flex}
.hero.app-started.stats-collapsed .stats-toggle span{transform:rotate(180deg) translateY(-1px)}
.hero.app-started.stats-collapsed .stats{display:none!important}
.hero.app-started.stats-collapsed{padding-bottom:50px}
@media(max-width:700px){
  .stats-toggle{right:12px;bottom:8px;width:36px;height:36px}
  .hero.app-started:not(.stats-collapsed){padding-bottom:52px}
}

@media(max-width:700px){h1{font-size:38px}.stats{grid-template-columns:1fr}.range{grid-template-columns:1fr}}

<style>
.stress-guide{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}
.stress-syllables{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stress-syllable{min-width:48px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer}
.stress-syllable.selected{background:#2563eb;color:#fff;border-color:#2563eb}.active-select{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important}
.stress-syllable.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.stress-syllable.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}
.screen{display:none!important}.screen.active{display:block!important}

</style>
</style>
<style>
#homeScreen{
  position:fixed !important;
  top:50% !important;
  left:50% !important;
  transform:translate(-50%,-50%) !important;
  width:min(880px,calc(100vw - 32px)) !important;
  margin:0 !important;
  z-index:100 !important;
}
</style>
<style>
#homeScreen.app-started{
  position:sticky !important;
  top:0 !important;
  left:auto !important;
  transform:none !important;
  width:auto !important;
  margin:0 auto !important;
  z-index:1000 !important;
}
#homeScreen.app-started .stats{
  margin-top:0 !important;
}
</style>

<style id="sakura-theme">
:root{
  --blue:#e86a9b;
  --blue-dark:#c94f7f;
  --bg:#fff7fb;
  --line:#f2d9e4;
  --text:#352633;
  --muted:#7f6876;
  --pink-soft:#fff0f6;
  --pink-pale:#fff7fa;
  --pink-mid:#f8d9e6;
  --pink-green:#e8f5ef;
}

/* 전체 분위기 */
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 10% 8%, rgba(248,185,211,.32) 0 80px, transparent 81px),
    radial-gradient(circle at 92% 18%, rgba(251,214,229,.35) 0 110px, transparent 111px),
    linear-gradient(180deg,#fffafd 0%,#fff7fb 52%,#fff9fc 100%);
  color:var(--text);
}
body::before,
body::after{
  content:"";
  position:fixed;
  width:18px;height:24px;
  background:linear-gradient(145deg,#f7b8d0 0%,#f3a9c5 72%,#e98caf 100%);
  border-radius:80% 20% 80% 20%;
  opacity:.48;
  pointer-events:none;
  z-index:0;
  box-shadow:
    0 120px 0 -2px rgba(245,169,199,.38),
    70px 260px 0 1px rgba(247,190,214,.35),
    -35px 430px 0 -1px rgba(238,158,192,.3);
}
body::before{top:90px;left:4%;transform:rotate(28deg)}
body::after{top:150px;right:5%;transform:rotate(-32deg) scale(.85)}

.app{position:relative;z-index:1;max-width:1080px;padding:24px 18px 70px}

/* 시작 화면 / 상단 헤더 */
.hero,.panel{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  box-shadow:0 12px 32px rgba(164,87,119,.10);
  backdrop-filter:blur(8px);
}
.hero{
  border-radius:26px;
  padding:30px;
}
h1{
  color:#402433;
  letter-spacing:-2.5px;
}
h2,h3{color:#472837}
p{color:var(--muted)}
.muted{color:var(--muted)!important}

/* 버튼 */
button{
  background:linear-gradient(135deg,#ed78a6,#df5f92);
  color:#fff;
  border-radius:13px;
  padding:11px 17px;
  box-shadow:0 5px 12px rgba(223,95,146,.18);
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
button:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 7px 16px rgba(223,95,146,.24);
}
button.secondary{
  background:#fff0f6;
  color:#c94f7f;
  border:1px solid #f4d4e1;
  box-shadow:none;
}
button.gray{
  background:#f4eef2;
  color:#66515e;
  box-shadow:none;
}
button.active-select,
.active-select{
  background:linear-gradient(135deg,#df5f92,#c94f7f)!important;
  color:#fff!important;
  border-color:#c94f7f!important;
  box-shadow:0 6px 14px rgba(201,79,127,.24)!important;
}
button:disabled{box-shadow:none}

/* 카드 / 통계 */
.panel{
  border-radius:22px;
  padding:24px;
  margin-top:18px;
}
.stats{gap:12px;margin-top:20px}
.stat{
  background:linear-gradient(145deg,#fff8fb,#fff0f6);
  border:1px solid #f3dbe5;
  border-radius:16px;
  padding:15px;
}
.stat small{color:#8b6c7b}
.stat strong{color:#4b2938}

/* 선택 영역 */
.notice{
  background:#fff0f6;
  color:#a8466e;
  border:1px solid #f5d7e3;
}
.badge{
  background:#fff0f6;
  color:#9b5873;
  border:1px solid #f1d9e4;
}
.keygrid{gap:11px}
.keybtn{
  background:#fff5f8;
  color:#c94f7f;
  border:1px solid #f0d6e1;
  box-shadow:none;
}
.keybtn:hover:not(:disabled){background:#ffe7f0}
.keybtn.active-select{
  background:linear-gradient(135deg,#df5f92,#c94f7f)!important;
  color:#fff!important;
}

/* 파일 / 목록 */
.filebox{
  border-color:#e9b9cd;
  background:#fffafd;
}
.saved-file-item{
  background:#fff0f6;
  color:#b74a75;
  border:1px solid #f2d4e0;
}
.saved-file-item:hover{background:#ffe4ee}

/* 문제 카드 */
.quiz{
  background:linear-gradient(145deg,#fff9fb,#fff3f7);
  border:1px solid #f1d8e3;
}
.question{color:#412735}
.answer{
  border-color:#e7cad6;
  background:#fff;
  color:#3e2a35;
}
.feedback{
  background:#fff;
  border-color:#efd9e3;
}
.passage-answer-btn{
  background:linear-gradient(135deg,#ed78a6,#df5f92)!important;
}

/* 본문 / 일반 리스트 */
.item{
  border-color:#efd9e3;
  background:#fff;
}
.item:hover{background:#fff4f8}
.list{gap:10px}

/* 강세 연습 */
.stress-guide{
  border-color:#efd9e3;
  background:#fff7fa;
}
.stress-syllable{
  border-color:#ecd2dd;
  background:#fff;
  color:#4d3040;
}
.stress-syllable:hover{background:#fff0f6}
.stress-syllable.selected{
  background:#df5f92;
  color:#fff;
  border-color:#df5f92;
}
.stress-syllable.correct{
  background:#e8f7ef;
  color:#27704d;
  border-color:#9dd5b8;
}
.stress-syllable.wrong{
  background:#fff0f2;
  color:#b33d4d;
  border-color:#f1aab5;
}

/* 입력창 */
.range input,
input.answer{
  border-color:#e7cbd7;
}
input:focus{
  outline:none;
  border-color:#df7fa3;
  box-shadow:0 0 0 3px rgba(223,127,163,.13);
}

/* 모바일 */
@media(max-width:700px){
  .app{padding:14px 12px 50px}
  .hero{padding:24px 18px}
  .panel{padding:18px}
  h1{font-size:38px}
  h2{font-size:24px}
  button{padding:10px 14px}
}
</style>


<style id="collapse-arrow-only-real">
#homeScreen.app-started.stats-collapsed{
  background:transparent !important;
  background-color:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  outline:0 !important;
  padding:0 !important;
  margin:0 !important;
  min-height:42px !important;
  height:42px !important;
  border-radius:0 !important;
  overflow:visible !important;
}
#homeScreen.app-started.stats-collapsed > *{
  display:none !important;
}
#homeScreen.app-started.stats-collapsed > #homeStatsToggle{
  display:flex !important;
  position:absolute !important;
  right:12px !important;
  bottom:4px !important;
  width:36px !important;
  height:36px !important;
  min-width:36px !important;
  padding:0 !important;
  margin:0 !important;
  background:#fff7fb !important;
  border:1px solid #efbfd2 !important;
  border-radius:50% !important;
  box-shadow:0 4px 12px rgba(180,82,125,.14) !important;
  color:#d45d8e !important;
  align-items:center !important;
  justify-content:center !important;
  z-index:1001 !important;
}
#homeScreen.app-started.stats-collapsed > #homeStatsToggle > span{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
}
@media(max-width:700px){
  #homeScreen.app-started.stats-collapsed{
    min-height:42px !important;
    height:42px !important;
  }
  #homeScreen.app-started.stats-collapsed > #homeStatsToggle{
    right:10px !important;
    bottom:3px !important;
  }
}
</style>
</head>
<body>
<div class="app">

<section class="hero" id="homeScreen">
<h1 id="homeTitle">영어 마스터</h1>
<p class="muted" id="homeDescription">MD 학습자료를 불러와 본문 읽기와 단어·뜻·발음 연습을 합니다.</p>
<div class="row" id="homeActions">
<button type="button" id="startBtn">시작하기</button>
<button type="button" id="savedBtn" class="secondary">저장된 파일로 시작</button>
</div>
<div class="stats" id="homeStats" style="display:none">
<div class="stat"><small>본문</small><strong id="passageCount">0</strong></div>
<div class="stat"><small>단어</small><strong id="wordCount">0</strong></div>
<div class="stat"><small>현재 자료</small><strong id="fileName">없음</strong></div>
</div>
<button type="button" id="homeStatsToggle" class="stats-toggle" aria-expanded="true" aria-label="상단 정보 접기" title="상단 정보 접기"><span aria-hidden="true">⌃</span></button>
</section>

<section class="panel hidden screen" id="savedPanel">
<div class="page-title-row">
<h2>저장된 파일로 시작</h2>
<button type="button" id="savedBack" class="gray">뒤로</button>
</div>
<p class="muted">저장된 학습 자료 중 하나를 선택하세요.</p>
<div id="savedFileList" class="saved-file-list"></div>
<div id="savedFileMessage" class="notice hidden"></div>
</section>

<section class="panel hidden screen" id="uploadPanel">
<div class="page-title-row">
<h2>학습 자료 불러오기</h2>
<button type="button" id="uploadBack" class="gray">뒤로</button>
</div>
<div class="row" style="margin-bottom:16px">
<button type="button" id="uploadStartBtn" class="secondary">시작하기</button>
</div>
<div class="filebox">
<input id="fileInput" type="file" accept=".md,.markdown,.txt,text/plain">
<p class="muted">MD 파일을 선택하세요.</p>
</div>
</section>

<section class="panel hidden screen" id="modePanel">
<div class="page-title-row">
<h2>무엇을 공부할까요?</h2>
<button type="button" id="modeBack" class="gray">뒤로</button>
</div>
<div class="row">
<button type="button" id="passageBtn" class="secondary">1. 본문 읽기 연습</button>
<button type="button" id="wordBtn" class="secondary">2. 영어 단어 연습</button>
</div>
</section>

<section class="panel hidden screen" id="passagePanel">
<h2>본문 읽기 연습</h2>
<div class="row">
<button type="button" id="randomBtn" class="secondary">랜덤으로 읽기</button>
<button type="button" id="chooseBtn" class="secondary">원하는 본문 읽기</button>
<button type="button" id="stressBtn" class="secondary">강세 연습하기</button>
<button type="button" id="passageBack" class="secondary">뒤로</button>
</div>



<div id="chooseArea" class="hidden" style="margin-top:18px">
<div class="notice">학습자료에 있는 본문 번호를 선택하세요.</div>
<div id="keyGrid" class="keygrid"></div>
<div id="passageList" class="list"></div>
</div>
<div id="passageQuiz" class="hidden" style="margin-top:18px"></div>
<div id="stressArea" class="hidden" style="margin-top:18px">
<div class="notice">강세 연습할 본문 번호를 선택하세요. 번호를 누르면 바로 연습이 시작됩니다.</div>
<div class="row" style="margin-top:12px">
  <button type="button" id="stressTodayWrongBtn" class="secondary">오늘의 오답</button>
  <button type="button" id="clearStressTodayWrongBtn" class="secondary" onclick="clearStressTodayWrong()">오늘의 오답노트 비우기</button>
</div>
<div id="stressTodayWrongList" class="hidden" style="margin-top:12px"></div>
<div id="stressKeyGrid" class="keygrid" style="margin-top:12px"></div>
<div id="stressPassageList" class="list" style="margin-top:12px"></div>
<div id="stressSelectedPassage" class="panel hidden" style="margin-top:16px"></div>
<div id="passageStressPractice" class="panel hidden" style="margin-top:16px">
  <h3 style="margin-top:0">강세 연습하기</h3>
  <p class="muted">선택한 본문에 나오는 단어들의 강세를 맞혀보세요.</p>
  <div id="passageStressQuiz"></div>
</div>
</div>
</section>
<section class="panel hidden screen" id="wordPanel">
<h2>영어 단어 연습</h2>
<div class="row">
<button type="button" id="wordTab" class="active-select">단어</button>
<button type="button" id="meaningTab" class="secondary">뜻</button>
<button type="button" id="pronTab" class="secondary">발음</button>
<button type="button" id="wordBack" class="gray">뒤로</button>
</div>

<div style="margin-top:18px">
  <div style="font-size:13px;color:var(--muted);margin-bottom:8px">시험 범위를 선택하세요</div>
  <div id="wordRangeGrid" class="keygrid"></div>
  <div class="row" style="margin-top:10px">
    <button type="button" id="selectAllRange" class="secondary">전체 선택</button>
    <button type="button" id="clearRange" class="gray">전체 해제</button>
  </div>
</div>
<div style="margin-top:12px">
<span class="badge" id="modeBadge">모드: 단어</span>
<span class="badge" id="rangeBadge">범위: 전체</span>
</div>

<div id="wrongNoteArea"></div>

<div id="wordQuiz" class="quiz" style="margin-top:14px"></div>
</section>

</div>

<script>
(function(){
"use strict";

const SAMPLE = `[25-1] Some plant diseases are indeed difficult to ______ because they can spread rapidly and easily, impacting multiple plants in a vast area./eradicate
1 | [25-1] | diseases | 질병들 | 명사 | 디**지**지스
2 | [25-1] | disease | 질병 | 명사 | 디**지**스
3 | [25-1] | indeed | 정말, 실제로, 확실히 | 부사 | 인**디드**
4 | [25-1] | spread | 퍼지다, 확산하다 | 동사 | 스프레드
5 | [25-1] | rapidly | 빠르게, 신속하게 | 부사 | **래**피들리
6 | [25-1] | easily | 쉽게 | 부사 | **이**즐리
7 | [25-1] | impacting | ~영향을 미치면서 | 현재분사 | 임**팩**팅
8 | [25-1] | multiple | 여러 개의, 다수의 | 형용사 | **멀**티플
9 | [25-1] | vast | 매우 넓은 | 형용사 | 배스트
10 | [25-1] | eradicate | 박멸하다, 근절하다 | 동사 | 이**래**디케이트
[25-2] In the business world, ______ is highly valued as it showcases a person's commitment to meeting deadlines and respecting others' time./punctuality
11 | [25-2] | highly | 매우, 높게, 높이 | 부사 | **하**일리
12 | [25-2] | value | 중요하게 여기다, 가치있게 여기다, 평가하다 | 동사 | **밸**류
13 | [25-2] | showcase | 보여주다, 드러내다, 돋보이게 하다 | 동사 | **쇼**케이스
14 | [25-2] | commitment | 헌신, 전념, 의무, 책임감 | 명사 | 커**밋**먼트

function makeDataId(text,name){
  const source=String(name||"자료")+"\n"+String(text||"");
  // Web Crypto가 없어도 GitHub Pages/모바일에서 안정적으로 동작하도록 간단한 32-bit 해시 사용
  let h=2166136261;
  for(let i=0;i<source.length;i++){
    h^=source.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return "d"+(h>>>0).toString(36);
}

function displayPronunciation(pron){
  return String(pron || "")
    .split(/\s*\+\s*/)[0]
    .trim();
}

function esc(v){
return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function parse(text){
passages=[];
words=[];
const lines=String(text||"").split(/\r?\n/);

for(const raw of lines){
  const line=raw
    .replace(/^\uFEFF/,"")
    .replace(/[\u200B-\u200D\u2060]/g,"")
    .trim();

  if(!line) continue;

  // 본문 형식:
  // \[25-2] In the business world, \_\_\_\_\_\_\_\_ .../punctuality
  // 실제 MD에서는 [ 와 _ 앞에 백슬래시가 붙어 있을 수 있음.
  const pm=line.match(/^\\?\[\s*(\d{2}-\d+)\s*\\?\]\s*(.+?)\/\s*([^/]+?)\s*$/);

  if(pm){
    const passageText=pm[2]
      .replace(/\\_/g,"_")
      .replace(/\\([[\]])/g,"$1")
      .trim();

    passages.push({
      key:pm[1],
      text:passageText,
      answer:pm[3].trim()
    });
    continue;
  }

  // 단어 형식:
  // 14 | \[25-2] | highly | 매우... | 부사 | **하**일리
  const wm=line.match(
    /^\d+\s*\|\s*\\?\[\s*(\d{2}-\d+)\s*\\?\]\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*(.+)$/
  );

  if(wm){
    words.push({
      key:wm[1],
      word:wm[2].trim(),
      meaning:wm[3].trim(),
      pos:wm[4].trim(),
      pron:wm[5].trim()
    });
  }
}

updateStats();
}

let passageStressWords=[], passageStressIndex=0, passageStressCorrect=0, passageStressPassage=null, passageStressWrong=[], passageStressRetake=false;
let stressTodayWrong=[];


function todayDateKey(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function loadStressTodayWrong(){
  try{
    const scopedKey=scopedStorageKey("englishMasterStressWrongToday");
    let raw=localStorage.getItem(scopedKey);
    if(raw===null && !localStorage.getItem("englishMasterScopedMigrationDone")){
      const legacy=localStorage.getItem(LEGACY_STRESS_KEY);
      if(legacy!==null){
        raw=legacy;
        localStorage.setItem(scopedKey,legacy);
      }
    }
    const saved=JSON.parse(raw||"null");
    if(saved && saved.date===todayDateKey() && Array.isArray(saved.items)){
      stressTodayWrong=saved.items;
    }else{
      stressTodayWrong=[];
      localStorage.setItem(scopedStorageKey("englishMasterStressWrongToday"),JSON.stringify({
        date:todayDateKey(),items:[]
      }));
    }
  }catch(e){
    stressTodayWrong=[];
  }
}

function saveStressTodayWrong(){
  localStorage.setItem(scopedStorageKey("englishMasterStressWrongToday"),JSON.stringify({
    date:todayDateKey(),
    items:stressTodayWrong
  }));
}

function addStressTodayWrong(w){
  const exists=stressTodayWrong.some(x=>x.key===w.key && x.word===w.word);

function passageStressCandidates(p){
  // 본문에 실제로 등장하는 단어만 찾는 것이 아니라,
  // 학습자료에서 같은 본문 번호에 배정된 단어를 모두 사용합니다.
  // 따라서 25-1에 등록된 13개 단어라면 13개가 모두 출제됩니다.
  const seen=new Set(), out=[];
  words.forEach(w=>{
    const key=w.key+"|"+w.word;
    if(seen.has(key)) return;
    if(w.key===p.key){
      out.push(w);
      seen.add(key);
    }
  });
  return out;
}

function renderPassageStressPractice(p, reviewWords=null){
  // 선택한 본문 자체를 강세 연습 화면 위에 먼저 보여줍니다.
  passageStressPassage=p;
  const passageTextBox=$("stressSelectedPassage");
  if(passageTextBox){
    passageTextBox.innerHTML=`
      <div class="question">[${esc(p.key)}] 본문</div>
      <div style="font-size:18px;line-height:1.9;margin-top:10px">${esc(p.text)}</div>`;
    passageTextBox.classList.remove("hidden");
  }

  // 처음 시험은 전체 단어를 랜덤으로, 오답 재시험은 틀린 단어만 랜덤으로 출제합니다.
  passageStressRetake=Array.isArray(reviewWords);
  passageStressWords=shuffleArray(reviewWords || passageStressCandidates(p));
  passageStressIndex=0;
  passageStressCorrect=0;
  if(!passageStressRetake) passageStressWrong=[];
  renderPassageStressQuestion();
}

function renderPassageStressQuestion(){
  const box=$("passageStressQuiz");
  if(!box)return;
  if(!passageStressWords.length){
    box.innerHTML='<div class="notice">이 본문에 연결된 단어가 없습니다.</div>';
    return;
  }
  if(passageStressIndex>=passageStressWords.length){
    const wrongCount=passageStressWrong.length;
    if(passageStressRetake){
      box.innerHTML=`
        <div class="notice">
          <b>오답 재시험 완료!</b><br>
          ${passageStressWords.length}문제 중 ${passageStressCorrect}문제 정답
        </div>
        <button type="button" id="passageStressRetryWrong" ${wrongCount?"":"disabled"} style="margin-top:10px">
          ${wrongCount ? "틀린 단어 다시 시험하기" : "모두 맞혔습니다"}
        </button>`;
      if(wrongCount){
        $("passageStressRetryWrong").onclick=()=>{
          const wrongWords=[...passageStressWrong];
          passageStressWrong=[];
          passageStressRetake=true;
          passageStressWords=shuffleArray(wrongWords);
          passageStressIndex=0;
          passageStressCorrect=0;
          renderPassageStressQuestion();
        };
      }
    }else{
      box.innerHTML=`
        <div class="notice">
          <b>강세 연습 완료!</b><br>
          ${passageStressWords.length}문제 중 ${passageStressCorrect}문제 정답
        </div>
        ${wrongCount ? `
          <button type="button" id="passageStressReviewWrong" style="margin-top:10px">
            틀린 단어 다시 시험하기 (${wrongCount}개)
          </button>` : `
          <div class="notice" style="margin-top:10px">모든 문제를 맞혔습니다!</div>`}`;
      if(wrongCount){
        $("passageStressReviewWrong").onclick=()=>{
          const wrongWords=[...passageStressWrong];
          passageStressWrong=[];
          renderPassageStressPractice(passageStressPassage, wrongWords);
        };
      }
    }
    return;
  }
  const w=passageStressWords[passageStressIndex], parts=getStressParts(w.pron,w.word);
  if(!parts){
    box.innerHTML=`<div class="question">${passageStressIndex+1} / ${passageStressWords.length}</div>
      <p><b>${esc(w.word)}</b></p>
      <div class="notice">이 단어의 강세 정보가 자료에 없습니다.</div>
      <button type="button" id="skipPassageStress">다음 단어</button>`;
    $("skipPassageStress").onclick=()=>{passageStressIndex++;renderPassageStressQuestion();};
    return;
  }

  box.innerHTML=`
    <div class="question">${passageStressIndex+1} / ${passageStressWords.length}</div>
    <p><b>${esc(w.word)}</b></p>
    <div class="muted">발음: ${esc(displayPronunciation(w.pron).replace(/\*\*/g,""))}</div>
    <div class="muted" style="margin-top:8px">강세가 오는 음절을 <b>하나 이상</b> 선택하세요.</div>
    <div class="stress-syllables" style="margin-top:10px">
      ${parts.units.map((u,i)=>`<button type="button" class="stress-syllable" data-pstress="${i}">${esc(u)}</button>`).join("")}
    </div>
    <div style="margin-top:10px"><button type="button" class="stress-syllable" data-pstress="-1">강세 없음</button></div>
    <div class="row" style="margin-top:12px"><button type="button" id="checkPassageStress">정답 확인</button></div>
    <div id="passageStressFeedback" class="feedback hidden"></div>`;

  const selected=new Set();
  const buttons=[...document.querySelectorAll("[data-pstress]")];
  buttons.forEach(btn=>{
    btn.addEventListener("click",()=>{
      const v=Number(btn.dataset.pstress);
      if(v===-1){
        selected.clear();
        buttons.forEach(x=>x.classList.remove("selected"));
        btn.classList.add("selected");
        selected.add(-1);
        return;
      }
      selected.delete(-1);
      const noStress=buttons.find(x=>Number(x.dataset.pstress)===-1);
      if(noStress)noStress.classList.remove("selected");
      if(selected.has(v)){
        selected.delete(v); btn.classList.remove("selected");
      }else{
        selected.add(v); btn.classList.add("selected");
      }
    });
  });

  $("checkPassageStress").onclick=()=>{
    if(!selected.size){
      $("passageStressFeedback").classList.remove("hidden");
      $("passageStressFeedback").innerHTML='<span class="bad">강세 위치를 하나 이상 선택하세요.</span>';
      return;
    }
    const answer=[...selected];
    const chosenNoStress=answer.length===1 && answer[0]===-1;
    const ok=chosenNoStress ? parts.noStress : sameIndexSet(answer,parts.correctIndices);

    buttons.forEach(btn=>{
      const v=Number(btn.dataset.pstress);
      btn.classList.remove("correct","wrong");
      if(parts.noStress && v===-1)btn.classList.add("correct");
      if(!parts.noStress && parts.correctIndices.includes(v))btn.classList.add("correct");
      if((v===-1 && chosenNoStress && !parts.noStress) || (v!==-1 && selected.has(v) && !parts.correctIndices.includes(v)))btn.classList.add("wrong");
    });

    const fb=$("passageStressFeedback"); fb.classList.remove("hidden");
    if(ok){
      passageStressCorrect++;
      fb.innerHTML='<span class="ok">정답입니다!</span>';
    }else{
      // 현재 시험의 오답 + 오늘의 오답에 모두 기록합니다.
      if(!passageStressWrong.some(x=>x.key===w.key && x.word===w.word)){
        passageStressWrong.push(w);
      }
      addStressTodayWrong(w);
      renderStressTodayWrong();

      const answerText=parts.noStress ? "강세 없음" : parts.correctIndices.map(i=>parts.units[i]).join("");
      fb.innerHTML=`<span class="bad">오답입니다.</span><br>정답: <b>${esc(answerText)}</b>`;
    }
    $("checkPassageStress").textContent="다음 단어";
    $("checkPassageStress").onclick=()=>{passageStressIndex++;renderPassageStressQuestion();};
  };
}

function wordKeyValue(k){
const m=String(k).match(/^(\d{2})-(\d+)$/);
return m?Number(m[1])*1000+Number(m[2]):NaN;
}

function todayDateKey(){
const d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function loadTodayWrong(){
  try{
    const scopedKey=scopedStorageKey("englishMasterWrongToday");
    let raw=localStorage.getItem(scopedKey);
    // 기존 버전의 공용 오답노트가 있다면 현재 처음 불러온 자료에만 1회 귀속시킵니다.
    // 이후부터는 각 자료의 키를 사용하므로 서로 섞이지 않습니다.
    if(raw===null){
      const legacy=localStorage.getItem(LEGACY_TODAY_KEY);
      if(legacy!==null && !localStorage.getItem("englishMasterScopedMigrationDone")){
        raw=legacy;
        localStorage.setItem(scopedKey,legacy);
        localStorage.setItem("englishMasterScopedMigrationDone","1");
      }
    }
    const saved=JSON.parse(raw||"{}");
    if(saved.date===todayDateKey()){
      todayWrongKeys=new Set(saved.keys||[]);
      todayWrongTypes=new Map();
      const typeMap=saved.types && typeof saved.types==="object" ? saved.types : {};
      todayWrongKeys.forEach(key=>{
        const types=Array.isArray(typeMap[key]) ? typeMap[key] : [];
        // 이전 버전 오답 데이터에는 오답 유형 정보가 없으므로 단어로 표시합니다.
        todayWrongTypes.set(key,new Set(types.length ? types : ["word"]));
      });
    }else{
      todayWrongKeys=new Set();
      todayWrongTypes=new Map();
    }
  }catch(e){
    todayWrongKeys=new Set();
    todayWrongTypes=new Map();
  }
}

function loadTodayRevival(){
  try{
    const scopedKey=scopedStorageKey("englishMasterRevivalToday");
    let raw=localStorage.getItem(scopedKey);
    if(raw===null && !localStorage.getItem("englishMasterScopedMigrationDone")){
      const legacy=localStorage.getItem(LEGACY_REVIVAL_KEY);
      if(legacy!==null){
        raw=legacy;
        localStorage.setItem(scopedKey,legacy);
      }
    }
    const saved=JSON.parse(raw||"{}");
    if(saved.date===todayDateKey() && Array.isArray(saved.items)){
      revivalItems=saved.items;
    }else{
      revivalItems=[];
    }
  }catch(e){ revivalItems=[]; }
}

function saveTodayRevival(){
  try{
    localStorage.setItem(scopedStorageKey("englishMasterRevivalToday"), JSON.stringify({
      date:todayDateKey(),
      items:revivalItems
    }));
  }catch(e){}
}

function addTodayRevival(w,type){
  const key=w.key+"|"+w.word;
  const exists=revivalItems.some(x=>x.key===key && x.type===type);
  if(!exists){
    revivalItems.push({key, word:w.word, meaning:w.meaning, pron:w.pron, type});
    saveTodayRevival();
  }
}

function removeTodayWrongType(w,type){
  const key=w.key+"|"+w.word;
  const set=todayWrongTypes.get(key);
  if(set){
    set.delete(type);
    if(!set.size){
      todayWrongTypes.delete(key);
      todayWrongKeys.delete(key);
    }
  }else{
    todayWrongKeys.delete(key);
  }
  saveTodayWrong();
}

function startWrongNoteQuiz(){
  const queue=[];
  words.forEach(w=>{
    const types=getTodayWrongTypes(w);
    ["word","meaning","pron"].forEach(type=>{
      if(types.has(type)) queue.push({w,type});
    });
  });
  if(!queue.length){
    alert("오늘 오답노트에 문제가 없습니다.");
    return;
  }
  reviewQueue=shuffleArray(queue);
  reviewIndex=-1;
  reviewActive=true;
  nextReviewQuestion();
}

function nextReviewQuestion(){
  reviewIndex++;
  if(reviewIndex>=reviewQueue.length){
    reviewActive=false;
    const box=$("wordQuiz");
    box.innerHTML=`<div class="notice"><b>오답 다시 시험 완료!</b><br>틀렸던 항목을 모두 다시 시험했습니다.</div>`;
    renderWrongNote();
    return;
  }
  const item=reviewQueue[reviewIndex];
  currentWord=item.w;
  renderReviewQuestion(item);
}

function renderReviewQuestion(item){
  const w=item.w, type=item.type;
  const label={word:"단어",meaning:"뜻",pron:"발음"}[type];
  let prompt="", question="";
  if(type==="word"){
    prompt="뜻을 보고 영어 단어를 입력하세요.";
    question=`<p>${esc(w.meaning)}</p>`;
  }else if(type==="meaning"){
    prompt="영어 단어를 보고 뜻을 입력하세요.";
    question=`<p><b>${esc(w.word)}</b></p>`;
  }else{
    prompt="영어 단어의 발음을 입력하세요.";
    question=`<p><b>${esc(w.word)}</b></p>`;
  }
  $("wordQuiz").innerHTML=`
    <div class="question" style="font-weight:700;margin-bottom:10px">오답 다시 시험 · ${reviewIndex+1} / ${reviewQueue.length}</div>
    <div class="notice" style="margin-bottom:12px">이번 문제: <b>${esc(label)}</b></div>
    <div class="question">${prompt}</div>
    ${question}
    <input class="answer" id="wordAnswer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" inputmode="text" placeholder="${esc(label)}">
    <div class="row" style="margin-top:10px">
      <button type="button" id="checkReviewWord">정답 확인</button>
      <button type="button" id="nextReviewWord" class="gray">다음 문제</button>
    </div>
    <div id="reviewFeedback" class="feedback hidden"></div>`;

  const input=$("wordAnswer");
  const check=()=>checkReviewAnswer();
  $("checkReviewWord").addEventListener("click",check);
  $("nextReviewWord").addEventListener("click",nextReviewQuestion);
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      checkReviewAnswer();
    }
  });
  setTimeout(()=>{try{input.focus({preventScroll:true});}catch(_){input.focus();}},0);
}

function checkReviewAnswer(){
  if(!reviewActive || reviewIndex<0 || !reviewQueue[reviewIndex]) return;
  const item=reviewQueue[reviewIndex], w=item.w, type=item.type;
  const input=normalize($("wordAnswer")?.value||"");
  let ok=false, correct="";
  if(type==="word"){
    correct=w.word;
    ok=input===normalize(w.word);
  }else if(type==="meaning"){
    correct=w.meaning;
    ok=w.meaning.split(/[,，/]/).map(normalize).filter(Boolean).some(x=>input===x);
  }else{
    correct=displayPronunciation(w.pron).replace(/\*\*/g,"");
    const variants=new Set([normalize(correct),normalize(correct).replace(/팩/g,"펙"),normalize(correct).replace(/펙/g,"팩")]);
    ok=variants.has(input);
  }

  const fb=$("reviewFeedback");
  fb.classList.remove("hidden");
  if(ok){
    addTodayRevival(w,type);
    removeTodayWrongType(w,type);
    fb.innerHTML=`<span class="ok">정답입니다!</span><br><small>오늘의 패자부활로 이동했습니다.</small>`;
    $("checkReviewWord").disabled=true;
    $("nextReviewWord").textContent="다음 문제";
    renderTodayRevival();
  }else{
    fb.innerHTML=`<span class="bad">오답입니다.</span><br>정답: <b>${esc(correct)}</b>`;
  }
}

function renderWordRange(){
const keys=[...new Set(words.map(w=>w.key))]
  .sort((a,b)=>wordKeyValue(a)-wordKeyValue(b));

const grid=$("wordRangeGrid");
if(!grid)return;

if(!keys.length){
  grid.innerHTML="<p class='muted'>선택할 문제가 없습니다.</p>";
  return;
}

grid.innerHTML=keys.map(k=>{
  const selected=selectedRangeKeys.has(k);
  return `<button type="button"
    class="keybtn ${selected?"active-select":"secondary"}"
    data-range-key="${esc(k)}">
    ${esc(k)}
  </button>`;
}).join("");

grid.querySelectorAll("[data-range-key]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const key=btn.dataset.rangeKey;
    if(selectedRangeKeys.has(key)) selectedRangeKeys.delete(key);
    else selectedRangeKeys.add(key);
    renderWordRange();
    updateRangeBadge();
    startWordQuiz();
  });
});
}

function updateRangeBadge(){
const keys=[...selectedRangeKeys].sort((a,b)=>wordKeyValue(a)-wordKeyValue(b));
$("rangeBadge").textContent=keys.length
  ? "범위: "+keys.join(", ")
  : "범위: 전체";
}

function getFilteredWords(){
if(!selectedRangeKeys.size) return words;
return words.filter(w=>selectedRangeKeys.has(w.key));
}

function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startWordQuiz(){
  const list=getFilteredWords();
  wordQuizList=shuffleArray(list);
  wordQuizIndex=-1;
  newWord();
}

function setWordMode(m){
  wordMode=m;
  $("wordTab").className=m==="word"?"active-select":"secondary";
  $("meaningTab").className=m==="meaning"?"active-select":"secondary";
  $("pronTab").className=m==="pron"?"active-select":"secondary";
  $("modeBadge").textContent="모드: "+({word:"단어",meaning:"뜻",pron:"발음"}[m]);
  startWordQuiz();
}

function newWord(){
  if(!wordQuizList.length || wordQuizIndex>=wordQuizList.length-1){
    if(wordQuizIndex>=0 && wordQuizList.length){
      $("wordQuiz").innerHTML=`
        <div class="notice">
          <b>시험 완료!</b><br>
          총 ${wordQuizList.length}개 단어를 모두 풀었습니다.
        </div>
        <button type="button" id="restartWordQuiz">다시 시험하기</button>`;
      $("restartWordQuiz").onclick=startWordQuiz;
      return;
    }
    const list=getFilteredWords();
    if(!list.length){
      $("wordQuiz").innerHTML="<p class='muted'>현재 범위에 해당하는 단어가 없습니다.</p>";
      return;
    }
    wordQuizList=shuffleArray(list);
    wordQuizIndex=-1;
  }

  wordQuizIndex++;
  currentWord=wordQuizList[wordQuizIndex];
  renderWordQuestion();
}


function getStressParts(pron, word=""){
  // 발음 데이터에서 "+" 뒤는 보충 설명이므로 강세 연습에서는 완전히 제외합니다.
  const raw=displayPronunciation(pron).trim();
  const cleanRaw=raw.replace(/\s+/g,"");

  // 사용자가 지정한 강세 예외.
  const overrides={
    diseases:[1,2]
  };

  // 자료에 "강세 없음"이 명시된 경우
  if(/(?:강세\s*없음|no\s*stress)/i.test(raw)){
    const clean=raw.replace(/\s*(강세\s*없음|no\s*stress)\s*/ig,"").trim();
    return {
      units:[...clean.replace(/\s+/g,"")].filter(Boolean),
      correctIndices:[],
      stressed:"강세 없음",
      noStress:true
    };
  }

  // **...**가 있으면 그 부분을 강세로 사용합니다.
  const m=raw.match(/^\s*(.*?)\*\*(.+?)\*\*(.*?)\s*$/);

  if(!m){
    const units=[...cleanRaw].filter(Boolean);

    if(overrides[String(word||"").toLowerCase()]){
      const idx=overrides[String(word||"").toLowerCase()];
      return {
        units,
        correctIndices:idx,
        stressed:idx.map(i=>units[i]).join(""),
        noStress:false
      };
    }

    // 강세 표시가 없는 단어는 "강세 없음"이 정답입니다.
    return {
      units,
      correctIndices:[],
      stressed:"강세 없음",
      noStress:true
    };
  }

  const units=[];
  const boldIndices=[];

  const add=(text,isBold)=>{
    [...String(text).replace(/\s+/g,"")].forEach(ch=>{
      if(ch){
        if(isBold) boldIndices.push(units.length);
        units.push(ch);
      }
    });
  };

  add(m[1],false);
  add(m[2],true);
  add(m[3],false);

  let correctIndices=boldIndices;
  const override=overrides[String(word||"").toLowerCase()];
  if(override) correctIndices=override;

  return {
    units,
    correctIndices,
    stressed:correctIndices.map(i=>units[i]).join(""),
    noStress:false
  };
}

function sameIndexSet(a,b){
  const x=[...a].map(Number).sort((m,n)=>m-n);
  const y=[...b].map(Number).sort((m,n)=>m-n);
  return x.length===y.length && x.every((v,i)=>v===y[i]);
}

function renderStressQuestion(w){
const parts=getStressParts(w.pron,w.word);

if(!parts){
  return `
  <div class="question">이 단어의 발음에서 강세가 오는 음절을 선택하세요.</div>
  <p><b>${esc(w.word)}</b></p>
  <div class="stress-guide">
    <span class="bad">이 단어의 발음 자료에 강세 표시(**...**)가 없어 강세 정답을 확인할 수 없습니다.</span>
  </div>`;
}

return `
<div class="question">이 단어의 발음에서 <b>강세가 오는 음절</b>을 선택하세요.</div>
<p><b>${esc(w.word)}</b></p>
<div class="stress-guide">
  <div class="muted">발음: ${esc(displayPronunciation(w.pron).replace(/\*\*/g,""))}</div>
  <div class="stress-syllables" id="stressSyllables">
    ${parts.units.map((u,i)=>`
      <button type="button" class="stress-syllable"
              data-stress-index="${i}">${esc(u)}</button>
    `).join("")}
  </div>
  <div style="margin-top:10px">
    <button type="button" class="stress-syllable" data-stress-index="-1">강세 없음</button>
  </div>
  <input type="hidden" id="stressAnswer" value="">
</div>`;
}

function renderWordQuestion(){

const progress=`<div class="question" style="font-weight:700;margin-bottom:10px">${wordQuizIndex+1} / ${wordQuizList.length}</div>`;
let html="";
if(wordMode==="word"){
html=progress+`<div class="question">뜻을 보고 영어 단어를 입력하세요.</div>
<p>${esc(w.meaning)}</p>
<input class="answer" id="wordAnswer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" inputmode="text" placeholder="영어 단어">
`;
}else if(wordMode==="meaning"){
html=progress+`<div class="question">영어 단어를 보고 뜻을 입력하세요.</div>
<p><b>${esc(w.word)}</b></p>
<input class="answer" id="wordAnswer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" inputmode="text" placeholder="뜻">
`;
}else{

<p><b>${esc(w.word)}</b></p>
<input class="answer" id="wordAnswer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" inputmode="text" placeholder="한글 발음">

}
html+=`<div class="row" style="margin-top:10px">
<button type="button" id="checkWord">정답 확인</button>
<button type="button" id="nextWord" class="gray">다음 문제</button>
</div>
<div id="wordFeedback" class="feedback hidden"></div>`;
$("wordQuiz").innerHTML=html;

$("checkWord").addEventListener("click",checkWord);
$("nextWord").addEventListener("click",function(){
  const savedX=window.scrollX||0;
  const savedY=window.scrollY||window.pageYOffset||0;

  newWord();

  const newInput=document.getElementById("wordAnswer");
  if(newInput){
    try{
      newInput.focus({preventScroll:true});
      const len=newInput.value.length;
      newInput.setSelectionRange(len,len);
    }catch(_){
      newInput.focus();
    }
  }

  // Restore immediately, then once more after layout settles.
  window.scrollTo(savedX,savedY);
  requestAnimationFrame(function(){
    window.scrollTo(savedX,savedY);
    const input=document.getElementById("wordAnswer");
    if(input){
      try{ input.focus({preventScroll:true}); }catch(_){ input.focus(); }
    }
  });
});

}

function normalize(s){
return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/[.,!?'"“”‘’~()]/g,"");
}

function checkWord(){
const input=normalize($("wordAnswer").value);
const w=currentWord;
let correct="";
let ok=false;

if(wordMode==="word"){
correct=w.word;
ok=input===normalize(w.word);
}else if(wordMode==="meaning"){
correct=w.meaning;
const meanings=w.meaning.split(/[,，/]/).map(normalize).filter(Boolean);
ok=meanings.some(m=>input===m);
}else{
const parts=getStressParts(w.pron,w.word);
const correctPron=displayPronunciation(w.pron).replace(/\*\*/g,"");
const expectedPron=normalize(correctPron);

/* 1단계: 발음 입력 */
if(!$("stressAnswer")){
  correct=correctPron;

  // 표기 차이(예: 임팩팅/임펙팅)도 같은 발음으로 인정합니다.
  const pronunciationVariants=new Set([
    expectedPron,
    expectedPron.replace(/팩/g,"펙"),
    expectedPron.replace(/펙/g,"팩")
  ]);
  ok=pronunciationVariants.has(input);

  if(!ok){
    recordTodayWrong(w,"pron");
    renderWrongNote();

    $("wordFeedback").classList.remove("hidden");
    $("wordFeedback").innerHTML=
      `<span class="bad">발음이 틀렸습니다.</span><br>정답 발음: ${esc(correct)}<br><small>오늘 오답노트에 저장했습니다.</small>`;
    return;
  }

  $("wordFeedback").classList.remove("hidden");
  $("wordFeedback").innerHTML=
    `<span class="ok">발음 정답!</span><br>이제 <b>강세가 오는 음절</b>을 선택하세요.`;

  const stage=$("stressStage");
  stage.classList.remove("hidden");

  if(!parts){
    stage.innerHTML=`
      <div class="stress-guide">
        <div><b>2단계: 강세 정보가 없습니다.</b></div>
        <div class="muted" style="margin-top:6px">이 단어의 학습자료에 강세 표시가 없습니다.</div>
      </div>`;
    $("checkWord").textContent="다음 문제";
    $("checkWord").onclick=newWord;
    return;
  }

  stage.innerHTML=`
    <div class="stress-guide">
      <div><b>2단계: 강세가 오는 음절을 하나 이상 선택하거나, 강세가 없으면 '강세 없음'을 선택하세요.</b></div>
      <div class="muted" style="margin-top:6px">발음: ${esc(displayPronunciation(w.pron).replace(/\*\*/g,""))}</div>
      <div class="stress-syllables" id="stressSyllables">
        ${parts.units.map((u,i)=>`
          <button type="button" class="stress-syllable"
                  data-stress-index="${i}">${esc(u)}</button>
        `).join("")}
      </div>
      <div style="margin-top:10px">
        <button type="button" class="stress-syllable" data-stress-index="-1">강세 없음</button>
      </div>
      <input type="hidden" id="stressAnswer" value="">
    </div>`;

  const stressButtons=[...document.querySelectorAll("#stressSyllables .stress-syllable")];
  const noStressButton=document.querySelector("#stressStage [data-stress-index='-1']");
  const selectedStress=new Set();

  const syncStressAnswer=()=>{
    $("stressAnswer").value=[...selectedStress].sort((a,b)=>a-b).join(",");
  };

  stressButtons.forEach(btn=>{
    btn.addEventListener("click",()=>{
      const idx=Number(btn.dataset.stressIndex);
      if(selectedStress.has(idx)){
        selectedStress.delete(idx);
        btn.classList.remove("selected");
      }else{
        selectedStress.add(idx);
        btn.classList.add("selected");
      }
      if(selectedStress.size && noStressButton){
        noStressButton.classList.remove("selected");
      }
      syncStressAnswer();
    });
  });

  if(noStressButton){
    noStressButton.addEventListener("click",()=>{
      selectedStress.clear();
      stressButtons.forEach(x=>x.classList.remove("selected"));
      noStressButton.classList.toggle("selected");
      if(noStressButton.classList.contains("selected")) selectedStress.add(-1);
      syncStressAnswer();
    });
  }

  $("checkWord").textContent="강세 정답 확인";
  return;
}

/* 2단계: 강세 선택 */
const selectedRaw=$("stressAnswer") ? $("stressAnswer").value : "";
const selectedIndices=selectedRaw
  ? selectedRaw.split(",").filter(x=>x!=="").map(Number)
  : [];
const correctIndices=Array.isArray(parts.correctIndices)
  ? parts.correctIndices.map(Number)
  : (parts.correctIndex!=null ? [Number(parts.correctIndex)] : []);

correct=parts.stressed;
const selectedNoStress=selectedIndices.length===1 && selectedIndices[0]===-1;
ok=parts.noStress
  ? selectedNoStress
  : selectedIndices.length>0 && sameIndexSet(selectedIndices,correctIndices);

document.querySelectorAll("#stressStage .stress-syllable").forEach(btn=>{
  const idx=Number(btn.dataset.stressIndex);
  btn.classList.remove("correct","wrong");
  if(parts.noStress && idx===-1)btn.classList.add("correct");
  if(!parts.noStress && idx>=0 && correctIndices.includes(idx))btn.classList.add("correct");
  if(selectedIndices.includes(idx) && (
      (parts.noStress && idx!==-1) ||
      (!parts.noStress && idx>=0 && !correctIndices.includes(idx))
    ))btn.classList.add("wrong");
});

if(!ok){
  recordTodayWrong(w,"pron");
  renderWrongNote();
}
}

$("wordFeedback").classList.remove("hidden");

if(!ok){
  recordTodayWrong(w,wordMode==="word" ? "word" : wordMode==="meaning" ? "meaning" : "pron");
  renderWrongNote();
}

if(wordMode==="pron"){
  const parts=getStressParts(w.pron,w.word);
  const stressText=parts
    ? (parts.noStress
        ? "강세 없음"
        : parts.correctIndices.map(i=>parts.units[i]).join(""))
    : correct;

  $("wordFeedback").innerHTML=ok
  ?`<span class="ok">강세까지 정답입니다!</span><br>강세: ${esc(stressText)}`
  :`<span class="bad">강세가 틀렸습니다.</span><br>강세 정답: ${esc(stressText)}<br><small>오늘 오답노트에 저장했습니다.</small>`;
}else{
  $("wordFeedback").innerHTML=ok
  ?`<span class="ok">정답입니다!</span><br>정답: ${esc(correct)}`
  :`<span class="bad">오답입니다.</span><br>정답: ${esc(correct)}<br><small>오늘 오답노트에 저장했습니다.</small>`;
}
}

async function loadSavedFileList(){
  const list=$("savedFileList");
  const message=$("savedFileMessage");
  if(!list)return;
  list.innerHTML="";
  if(message){
    message.classList.add("hidden");
    message.textContent="";
  }
  showScreen("savedPanel");
  list.innerHTML='<p class="muted">학습 자료 목록을 불러오는 중...</p>';

  try{
    const response=await fetch(SAVED_FILES_MANIFEST,{cache:"no-store"});
    if(!response.ok) throw new Error("manifest");
    const files=await response.json();
    if(!Array.isArray(files)) throw new Error("format");

    const mdFiles=files.filter(item=>item && typeof item.file==="string" && item.file.toLowerCase().endsWith(".md"));
    if(!mdFiles.length){
      list.innerHTML="";
      showSavedFilesMessage("등록된 MD 학습 자료가 없습니다. data/files.json에 파일을 추가하세요.");
      return;
    }

    list.innerHTML="";
    mdFiles.forEach(item=>{
      const button=document.createElement("button");
      button.type="button";
      button.className="saved-file-item";
      button.textContent=item.name || item.file.split("/").pop();
      button.addEventListener("click",()=>loadSavedStudyFile(item,button));
      list.appendChild(button);
    });
  }catch(error){
    list.innerHTML="";
    showSavedFilesMessage("저장된 학습 자료 목록을 불러오지 못했습니다. GitHub에 data/files.json이 있는지 확인하세요.");
  }
}

async function loadSavedStudyFile(item,button){
  const filePath=String(item.file||"");
  if(!filePath)return;
  button.disabled=true;
  button.textContent="불러오는 중...";
  try{
    const response=await fetch(filePath,{cache:"no-store"});
    if(!response.ok) throw new Error("file");
    const text=await response.text();
    const fileName=item.name || filePath.split("/").pop();
    loadData(text,fileName);
    showScreen("modePanel");
  }catch(error){
    button.disabled=false;
    button.textContent=item.name || filePath.split("/").pop();
    alert("학습 자료를 불러오지 못했습니다. 파일 경로를 확인하세요.");
  }
}

<script id="mobile-enter-two-step-fix">
(function () {
  function isAnswerInput(el) {
    if (!el || !el.matches) return false;
    if (!el.matches('input, textarea')) return false;
    return !!el.closest(
      '.question, .word-card, .exercise, [class*="question"], [class*="word-card"], [class*="exercise"], form'
    );
  }

  function getVisibleButton(labels) {
    const buttons = Array.from(document.querySelectorAll('button'));
    return buttons.find(btn => {
      if (!btn.offsetParent) return false;
      const text = (btn.textContent || '').replace(/\s+/g, '');
      return labels.some(label => text === label || text.includes(label));
    }) || null;
  }

  function keepFocus(input) {
    requestAnimationFrame(() => {
      try {
        input.focus({ preventScroll: true });
        const len = input.value.length;
        if (typeof input.setSelectionRange === 'function') {
          input.setSelectionRange(len, len);
        }
      } catch (_) {
        input.focus();
      }
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;

    const input = document.activeElement;
    if (!isAnswerInput(input)) return;

    e.preventDefault();
    e.stopPropagation();

    // If the current question has not been checked yet, Enter acts as "정답 확인".
    const checkButton = getVisibleButton(['정답확인', '정답 확인']);
    if (checkButton) {
      checkButton.click();
      keepFocus(input);
      return;
    }

    // Once grading is complete, the next Enter acts as "다음 문제".
    const nextButton = getVisibleButton(['다음문제', '다음 문제']);
    if (nextButton) {
      nextButton.click();
      requestAnimationFrame(() => {
        const newInput =
          document.activeElement?.matches?.('input, textarea')
            ? document.activeElement
            : document.querySelector('input:focus, textarea:focus') ||
              document.querySelector(
                '.question input, .word-card input, .exercise input, [class*="question"] input, [class*="word-card"] input, [class*="exercise"] input'
              );
        if (newInput) keepFocus(newInput);
      });
    }
  }, true);
})();

/* 모바일 단어시험: Enter/이동 1회=정답 확인, 2회=다음 문제 */
document.addEventListener("keydown", function(e){
  if((e.key!=="Enter" && e.keyCode!==13) || e.isComposing) return;
  const input=e.target;
  if(!input || input.id!=="wordAnswer") return;

  e.preventDefault();
  e.stopImmediatePropagation();

  const check=document.getElementById("checkWord");
  const next=document.getElementById("nextWord");
  const feedback=document.getElementById("wordFeedback");
  const stressStage=document.getElementById("stressStage");

  if(!check) return;

  const stressCheck=(check.textContent||"").replace(/\s/g,"").includes("강세정답확인");

  if(stressStage && !stressStage.classList.contains("hidden") && stressCheck){
    check.click();
  }else if(feedback && !feedback.classList.contains("hidden")){
    if(next) next.click();
    else if((check.textContent||"").replace(/\s/g,"").includes("다음문제")) check.click();
  }else{
    check.click();
  }

  setTimeout(function(){
    const newInput=document.getElementById("wordAnswer");
    if(!newInput) return;
    try{
      newInput.focus({preventScroll:true});
      const len=newInput.value.length;
      newInput.setSelectionRange(len,len);
    }catch(_){ newInput.focus(); }
  },50);
}, true);

</script>


<script id="mobile-word-quiz-position-final">
(function(){
  document.addEventListener("keydown",function(e){
    if((e.key!=="Enter" && e.keyCode!==13) || e.isComposing) return;
    const input=e.target;
    if(!input || input.id!=="wordAnswer") return;

    const check=document.getElementById("checkWord");
    const next=document.getElementById("nextWord");
    const feedback=document.getElementById("wordFeedback");
    const stressStage=document.getElementById("stressStage");
    if(!check) return;

    const stressCheck=(check.textContent||"").replace(/\s/g,"").includes("강세정답확인");
    const afterAnswer=!!(feedback && !feedback.classList.contains("hidden"));

    e.preventDefault();
    e.stopImmediatePropagation();

    if(stressStage && !stressStage.classList.contains("hidden") && stressCheck){
      check.click();
      requestAnimationFrame(function(){
        const i=document.getElementById("wordAnswer");
        if(i){ try{i.focus({preventScroll:true});}catch(_){i.focus();} }
      });
      return;
    }

    if(afterAnswer && next){
      // This click happens directly inside the keyboard's user event.
      // The nextWord click handler above performs synchronous focus().
      next.click();
      return;
    }

    check.click();
    requestAnimationFrame(function(){
      const i=document.getElementById("wordAnswer");
      if(i){ try{i.focus({preventScroll:true});}catch(_){i.focus();} }
    });
  },true);
})();
</script>

<script id="theme-cycle-handler">
(function(){
  const THEMES=["","sky-theme","green-theme"];
  let themeIndex=0;
  let tapTimes=[];
  const MAX_GAP=320;
  const MAX_SEQUENCE=1600;

  function applyTheme(index){
    themeIndex=((index%THEMES.length)+THEMES.length)%THEMES.length;
    document.documentElement.classList.remove("sky-theme","green-theme");
    if(THEMES[themeIndex]) document.documentElement.classList.add(THEMES[themeIndex]);
  }

  // 새로 접속하거나 새로고침하면 항상 기본 핑크 테마에서 시작합니다.
  applyTheme(0);

  // 더블클릭은 테마 변경으로 사용하지 않습니다.
  // 마우스 클릭/휴대폰 터치 모두 pointerup 하나로만 세어 중복 집계를 막습니다.
  // 5회 모두 빠르게(각 간격 0.32초 이내, 전체 1.6초 이내) 눌러야 변경됩니다.
  document.addEventListener("pointerup",function(){
    const now=Date.now();
    const last=tapTimes[tapTimes.length-1];

    if(last && now-last>MAX_GAP) tapTimes=[];
    tapTimes.push(now);

    if(tapTimes.length===5){
      if(now-tapTimes[0]<=MAX_SEQUENCE) applyTheme(themeIndex+1);
      tapTimes=[];
    }
  },{passive:true});
})();
</script>

<script id="stress-selection-visibility-fix">
(function(){
  function isStressPage(){
    const text = document.body ? document.body.innerText : "";
    return text.includes("강세 연습하기");
  }

  function findStressRoot(){
    const headings = Array.from(document.querySelectorAll("h1,h2,h3"));
    const h = headings.find(el => el.textContent.trim() === "강세 연습하기");
    if(!h) return null;
    return h.closest(".panel, .card, section, main, div") || h.parentElement;
  }

  function getNumberButtons(root){
    if(!root) return [];
    return Array.from(root.querySelectorAll("button")).filter(btn => {
      const t = btn.textContent.trim();
      return /^(?:25-)?\d+(?:-\d+)?$/.test(t);
    });
  }

  function updateVisibility(){
    if(!isStressPage()) return;
    const root = findStressRoot();
    if(!root) return;

    const nums = getNumberButtons(root);
    if(!nums.length) return;

    const selected = nums.some(b =>
      b.classList.contains("active-select") ||
      b.classList.contains("selected") ||
      b.getAttribute("aria-pressed") === "true" ||
      b.getAttribute("aria-selected") === "true"
    );

    // 버튼들이 모두 기본 상태면 아직 본문을 선택하지 않은 것으로 본다.
    root.classList.toggle("stress-practice-unselected", !selected);
  }

  document.addEventListener("click", function(e){
    const btn = e.target.closest("button");
    if(btn) setTimeout(updateVisibility, 0);
  }, false);

  // SPA 화면 전환 및 기존 코드의 DOM 변경에도 대응
  const observer = new MutationObserver(function(){
    setTimeout(updateVisibility, 0);
  });
  observer.observe(document.body, {childList:true, subtree:true, attributes:true});

  setTimeout(updateVisibility, 100);
})();
</script>
